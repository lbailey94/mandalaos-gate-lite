name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate-lite + deps (continuity-receipt from PyPI)
        run: python -m pip install --quiet -e gate-lite continuity-receipt==0.4.0 pytest
      - name: Run gate-lite suite
        working-directory: gate-lite
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Barrier repro (issue #1 invariants)
        working-directory: gate-lite
        run: python tools/barrier_repro.py
      - name: Offline verification (captured outsider bundle)
        working-directory: gate-lite
        run: continuity-receipt-verify evidence/outsider-2026-09-24/bundle-task-*.json
      - name: Offline verification (captured 0.4 bundle)
        working-directory: gate-lite
        run: continuity-receipt-verify evidence/outsider-2026-09-24-04/bundle-task.json
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-lite-junit
          path: gate-lite/junit.xml
